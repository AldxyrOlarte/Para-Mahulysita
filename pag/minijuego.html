<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Minijuego</title>

	<link rel="stylesheet" href="../css/mini.css">
</head>
<body>
	<a href="../index.html" class="btn-regresar">Regresar al Inicio</a>

	<div id="game">
		<div id="hud">
			<div id="score">❤️ Amor: 0</div>
			<div id="lives"></div>
			<div id="best"></div>
		</div>

		<!-- Contenedor de mensajes temporales -->
		<div id="message"></div>

		<div id="basket">
			<img src="../img/hello-kitty-and-boyfriend.jpg" alt="hello-kitty-and-boyfriend">
		</div>

		<!-- Pantalla de victoria / derrota -->
		<div id="overlay">
			<h2 id="overlayTitle"></h2>
			<p id="overlayText"></p>
			<div>
				<button id="btnContinue">Seguir jugando</button>
				<button id="btnRestart">Jugar de nuevo</button>
			</div>
		</div>
	</div>

	<!-- Sin autoplay: los navegadores lo bloquean; arranca con el primer toque/clic -->
	<audio id="musica" loop>
		<source src="../musica/musica.mp3" type="audio/mpeg">
	</audio>
	<button id="musicBtn">🎵 Música</button>

	<script src="../js/mini.js"></script>
</body>
</html>
