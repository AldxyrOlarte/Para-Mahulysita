<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
	<meta name="theme-color" content="#ff6b81">
	<title>Minijuego</title>

	<!-- El ?v=3 evita que el navegador use una versión vieja guardada en caché -->
	<link rel="stylesheet" href="../css/mini.css?v=3">
</head>
<body>
	<div id="game">
		<a href="../index.html" class="btn-regresar">← Inicio</a>

		<div id="hud">
			<div id="score">❤️ Amor: 0</div>
			<div id="lives"></div>
			<div id="best"></div>
		</div>

		<div id="controls">
			<button id="menuBtn" type="button" aria-label="Menú y pausa">☰</button>
			<button id="musicBtn" type="button" aria-label="Música">🔇</button>
		</div>

		<!-- Mensajes temporales -->
		<div id="message"></div>

		<div id="basket">
			<img src="../img/hello-kitty-and-boyfriend.jpg" alt="hello-kitty-and-boyfriend" draggable="false">
		</div>

		<!-- Pantalla de inicio / menú-pausa / victoria / derrota -->
		<div id="overlay">
			<h2 id="overlayTitle"></h2>
			<p id="overlayText"></p>

			<!-- Menú de volumen -->
			<div id="volumeBox">
				<button id="volMute" type="button" aria-label="Silenciar o activar música">🔊</button>
				<button id="volDown" type="button" aria-label="Bajar volumen">−</button>
				<input id="volSlider" type="range" min="0" max="100" step="5" value="60" aria-label="Volumen">
				<button id="volUp" type="button" aria-label="Subir volumen">+</button>
				<span id="volValue">60%</span>
			</div>

			<div class="botones">
				<button id="btnContinue" type="button">Seguir jugando</button>
				<button id="btnRestart" type="button">Jugar de nuevo</button>
			</div>
		</div>
	</div>

	<!-- Sin autoplay: arranca cuando el jugador toca "Jugar" -->
	<audio id="musica" loop preload="auto">
		<source src="../musica/musica.mp3" type="audio/mpeg">
	</audio>

	<script src="../js/mini.js?v=3"></script>
</body>
</html>
