<!DOCTYPE html>
<html lang="es">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
		<meta name="theme-color" content="#ff4d98">
		<title>Nuestra historia 📖</title>

		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
		<link rel="stylesheet" href="../css/style.css">
		<link rel="stylesheet" href="../css/extras.css">
		<link rel="stylesheet" href="../css/historia.css">
	</head>
	<body>

		<div class="fondo" aria-hidden="true">
			<span></span>
			<span></span>
			<span></span>
		</div>

		<header>
			<div class="latido" aria-hidden="true">📖</div>
			<h1><span class="titulo-brillo">Nuestra historia</span></h1>
			<p class="his-sub">Cada momento que vale la pena guardar 💗</p>
			<a class="volver" href="../index.html">← Volver al inicio</a>
		</header>

		<main>

			<!-- Inicio de sesión (si ya entraste en otra página, no te lo pide) -->
			<section id="acceso" class="acceso-caja" aria-label="Entrar">
				<h2>Entra, mi amor 💗</h2>
				<form id="form-acceso">
					<label>Correo
						<input type="email" id="acc-correo" autocomplete="email" required>
					</label>
					<label>Contraseña
						<input type="password" id="acc-clave" autocomplete="current-password" required>
					</label>
					<p id="acc-error" class="m-error"></p>
					<button type="submit" class="btn-extra">Entrar</button>
				</form>
			</section>

			<section id="panel" hidden>
				<p id="his-resumen" class="his-resumen"></p>
				<div>
					<button type="button" id="btn-nuevo" class="btn-extra">➕ Agregar un recuerdo</button>
				</div>
				<div id="linea" class="linea"></div>
			</section>

		</main>

		<footer>
			<p>💖 Hecho con mucho amor 💖</p>
			<button type="button" id="btn-salir" class="admin-btn" hidden>Cerrar sesión</button>
		</footer>

		<script type="module" src="../js/historia.js"></script>
	</body>
</html>
