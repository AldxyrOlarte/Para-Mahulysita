<!DOCTYPE html>
<html lang="es">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
		<meta name="theme-color" content="#ff4d98">
		<title>Sorpresas de Mahuly 🎁</title>

		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
		<link rel="stylesheet" href="../css/style.css">
		<link rel="stylesheet" href="../css/extras.css">
		<link rel="stylesheet" href="../css/sorpresas.css">
	</head>
	<body>

		<div class="fondo" aria-hidden="true">
			<span></span>
			<span></span>
			<span></span>
		</div>

		<header>
			<div class="latido" aria-hidden="true">🎁</div>
			<h1><span class="titulo-brillo">Sorpresas de Mahuly</span></h1>
			<p class="sor-sub" id="sor-sub">Un rinconcito para sorprendernos 💗</p>
			<a class="volver" href="../index.html">← Volver al inicio</a>
		</header>

		<main>

			<!-- Inicio de sesión (si ya entraste al cuaderno, no te lo pide) -->
			<section id="acceso" class="acceso-caja" aria-label="Entrar">
				<h2>Entra, mi amor 💗</h2>
				<form id="form-acceso">
					<label>Correo
						<input type="email" id="acc-correo" autocomplete="email" required>
					</label>
					<label>Contraseña
						<input type="password" id="acc-clave" autocomplete="current-password" required>
					</label>
					<p id="acc-error" class="m-error"></p>
					<button type="submit" class="btn-extra">Entrar</button>
				</form>
			</section>

			<section id="panel" hidden>
				<h2 id="panel-titulo">Sorpresas</h2>
				<p class="extra-sub" id="panel-texto"></p>

				<div id="lista"></div>

				<div class="solo-admin">
					<button type="button" id="btn-nueva" class="btn-extra">➕ Preparar una sorpresa</button>
				</div>
			</section>

		</main>

		<footer>
			<p>💖 Hecho con mucho amor 💖</p>
			<button type="button" id="btn-salir" class="admin-btn" hidden>Cerrar sesión</button>
		</footer>

		<script type="module" src="../js/sorpresas.js"></script>
	</body>
</html>
