<!DOCTYPE html>

<head>

    <header>

    <div class="contenedor">

        <div class="sobre" id="sobre">

            <div class="tapa"></div>

            <div class="carta">

                <h2>💖 Para Mahulysita 💖</h2>

                <p id="mensaje"></p>

                <div class="firma">
                    Con cariño,<br>
                    Thiago ❤️

            </div>

        </div>

        <button onclick="abrirCarta()">Abrir Carta 💌</button>

            <button class="op" onclick="responder('Helado de chocolate 🍫')">🍫 Chocolate</button>
            <button class="op" onclick="responder('Helado de fresa 🍓')">🍓 Fresa</button>
            <button class="op" onclick="responder('Helado de vainilla 🍦')">🍦 Vainilla</button>
            <button class="op" onclick="responder('Mejor una sorpresa 🎁')">🎁 Sorpréndeme</button>
        </div>

        <p id="respuesta" class="respuesta"></p>

    </div>
