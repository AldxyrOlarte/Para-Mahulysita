<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#ff6b81">
    <title>Memorama del amor 📸</title>
    <link rel="stylesheet" href="../css/memorama.css">
</head>
<body>

<div id="app">

    <div class="barra">
        <a href="minijuego.html" class="btn-regresar">← Juegos</a>
        <button id="btnReiniciar" type="button" aria-label="Reiniciar partida">🔄</button>
    </div>

    <div id="hud">
        <div class="dato"><span>Movimientos</span><b id="movs">0</b></div>
        <div class="dato"><span>Tiempo</span><b id="tiempo">0:00</b></div>
        <div class="dato"><span>Parejas</span><b id="parejas">0/8</b></div>
        <div class="dato"><span>Récord</span><b id="record">-</b></div>
    </div>

    <div id="tablero" class="c4"></div>

    <p id="mensaje"></p>

    <div id="overlay">
        <h2 id="ovTitulo"></h2>
        <p id="ovTexto"></p>
        <div id="ovEstrellas"></div>
        <div id="ovBotones" class="botones"></div>
    </div>

</div>

<script src="../js/memorama.js"></script>
</body>
</html>
