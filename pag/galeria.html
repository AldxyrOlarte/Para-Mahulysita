<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#D45793">
    <title>Galería de Fotos 💖</title>
    <link rel="stylesheet" href="../css/galeria.css">
</head>
<body>

<header>
    <h1>Galería de Fotos con el Amor de mi vida <span class="latido">❤️</span></h1>
    <p>Capturando momentos inolvidables</p>
    <a href="../index.html" class="btn-regresar">← Regresar al Inicio</a>
</header>

<main>
    <section class="galeria" aria-label="Galería de fotos">

        <button class="foto" type="button" aria-label="Abrir foto 1">
            <img src="../img/juntos1.jpeg" alt="Nosotros juntos, foto 1" loading="lazy">
        </button>

        <button class="foto" type="button" aria-label="Abrir foto 2">
            <img src="../img/juntos2.jpeg" alt="Nosotros juntos, foto 2" loading="lazy">
        </button>

        <button class="foto" type="button" aria-label="Abrir foto 3">
            <img src="../img/juntos3.jpeg" alt="Nosotros juntos, foto 3" loading="lazy">
        </button>

        <button class="foto" type="button" aria-label="Abrir foto 4">
            <img src="../img/juntos4.jpeg" alt="Nosotros juntos, foto 4" loading="lazy">
        </button>

        <button class="foto" type="button" aria-label="Abrir foto 5">
            <img src="../img/juntos5.jpeg" alt="Nosotros juntos, foto 5" loading="lazy">
        </button>

        <button class="foto" type="button" aria-label="Abrir foto 6">
            <img src="../img/juntos6.jpeg" alt="Nosotros juntos, foto 6" loading="lazy">
        </button>

        <button class="foto" type="button" aria-label="Abrir foto 7">
            <img src="../img/juntos7.jpeg" alt="Nosotros juntos, foto 7" loading="lazy">
        </button>

        <button class="foto" type="button" aria-label="Abrir foto 8">
            <img src="../img/juntos8.jpeg" alt="Nosotros juntos, foto 8" loading="lazy">
        </button>

    </section>
</main>

<footer>
    <p>Hecho con mucho amor 💕</p>
</footer>

<script src="../js/galeria.js"></script>
</body>
</html>
